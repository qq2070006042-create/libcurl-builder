name: Build Android arm64 single libcurl

on:
  workflow_dispatch:
    inputs:
      curl_version:
        description: curl version
        required: true
        default: 8.10.1
      openssl_version:
        description: OpenSSL version
        required: true
        default: 3.3.2
      zlib_version:
        description: zlib version
        required: true
        default: 1.3.1
      android_api:
        description: Android API level
        required: true
        default: '23'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y build-essential perl autoconf automake libtool pkg-config

      - name: Prepare Android NDK
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Create directories
        run: mkdir -p downloads build prefix/android-arm64 out

      - name: Download source archives
        run: |
          CV='${{ github.event.inputs.curl_version }}'
          OV='${{ github.event.inputs.openssl_version }}'
          ZV='${{ github.event.inputs.zlib_version }}'
          curl -fL --retry 5 -o downloads/curl.tar.xz "https://curl.se/download/curl-${CV}.tar.xz"
          curl -fL --retry 5 -o downloads/openssl.tar.gz "https://www.openssl.org/source/openssl-${OV}.tar.gz"
          curl -fL --retry 5 -o downloads/zlib.tar.gz "https://zlib.net/zlib-${ZV}.tar.gz"

      - name: Extract sources
        run: |
          mkdir -p build/curl build/openssl build/zlib
          tar -xf downloads/curl.tar.xz -C build/curl --strip-components=1
          tar -xf downloads/openssl.tar.gz -C build/openssl --strip-components=1
          tar -xf downloads/zlib.tar.gz -C build/zlib --strip-components=1

      - name: Build zlib static
        run: |
          cd build/zlib
          export CC=aarch64-linux-android${{ github.event.inputs.android_api }}-clang
          CHOST=aarch64-linux-android ./configure --static --prefix="$GITHUB_WORKSPACE/prefix/android-arm64"
          make -j$(nproc)
          make install

      - name: Build OpenSSL static
        run: |
          cd build/openssl
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./Configure android-arm64 -D__ANDROID_API__=${{ github.event.inputs.android_api }} --prefix="$GITHUB_WORKSPACE/prefix/android-arm64" no-shared no-tests no-ui-console no-async no-dso no-engine
          make -j$(nproc)
          make install_sw

      - name: Build libcurl shared with static OpenSSL and zlib
        run: |
          cd build/curl
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android${{ github.event.inputs.android_api }}-clang
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          export CPPFLAGS="-I$GITHUB_WORKSPACE/prefix/android-arm64/include"
          export CFLAGS="-fPIC -O2"
          export LDFLAGS="-L$GITHUB_WORKSPACE/prefix/android-arm64/lib"
          export LIBS="$GITHUB_WORKSPACE/prefix/android-arm64/lib/libssl.a $GITHUB_WORKSPACE/prefix/android-arm64/lib/libcrypto.a $GITHUB_WORKSPACE/prefix/android-arm64/lib/libz.a -ldl -lm -llog"
          ./configure --host=aarch64-linux-android --prefix="$GITHUB_WORKSPACE/prefix/android-arm64/curl" --enable-shared --disable-static --with-openssl="$GITHUB_WORKSPACE/prefix/android-arm64" --with-zlib="$GITHUB_WORKSPACE/prefix/android-arm64" --disable-ldap --disable-ldaps --disable-rtsp --disable-dict --disable-telnet --disable-tftp --disable-pop3 --disable-imap --disable-smb --disable-smtp --disable-gopher --disable-mqtt --without-libidn2 --without-libpsl --without-nghttp2 --without-brotli --without-zstd
          make -j$(nproc)
          make install
          cp "$GITHUB_WORKSPACE"/prefix/android-arm64/curl/lib/libcurl.so* "$GITHUB_WORKSPACE/out/" || true
          cp "$GITHUB_WORKSPACE"/prefix/android-arm64/curl/lib/libcurl.so "$GITHUB_WORKSPACE/out/libcurl-arm64-v8a-single.so"
          llvm-strip --strip-unneeded "$GITHUB_WORKSPACE/out/libcurl-arm64-v8a-single.so" || true

      - name: Verify result
        run: |
          readelf -h out/libcurl-arm64-v8a-single.so | tee out/ELF_HEADER.txt
          readelf -d out/libcurl-arm64-v8a-single.so | tee out/NEEDED.txt
          ! grep -E 'libssl|libcrypto|libz|libnghttp2|brotli|zstd|idn2|psl|cares' out/NEEDED.txt
          grep -q AArch64 out/ELF_HEADER.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcurl-arm64-v8a-single
          path: out/
